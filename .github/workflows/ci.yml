name: CI

# Fast compile check on every push to main and every PR — catches build
# breakage before a release tag is ever cut. No signing or secrets involved.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select latest Xcode (Swift 6)
        run: |
          LATEST=$(ls -d /Applications/Xcode_16*.app /Applications/Xcode.app 2>/dev/null | sort -V | tail -1)
          echo "Using $LATEST"
          sudo xcode-select -s "$LATEST"
      - name: Swift version
        run: swift --version
      - name: Build (release)
        run: swift build -c release
